[project]
name = "agentic-migration-adviser"
version = "0.1.0"
description = "This tool will scan a codebase, flag classical crypto usage, and produce a risk-ranked migration roadmap mapped to NIST's PQC standards."
readme = "README.md"
authors = [
    { name = "Jacob", email = "57604432+JacobProwse@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "liboqs-python>=0.16.0",
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
agentic-migration-adviser = "agentic_migration_adviser:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
timeout = 10

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.10",
]
